<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="/css/index.css">
        <title>Travel Finder</title>
        <script src="/js/main.js" defer></script>

    </head>
    <body>

        <header class="head1">

            <h2>TRAVEl..</h2>
            <h3 class="small-text-hollow">Find Your Place</h3>
            <h2 id="place-button-head">Discover My Place</h2>

        </header>

        <div class="mian-page">

            <h1 class="main-text">Your Next Holiday</h1>
            <h4 class="non-main-text">Not sure where to go?<br>
                Find a place that feels like you</h4>
            <h5 id="discover-button">Discover Your Place</h5>
            <img class="japan-location-map" src="/assets/img/japan-yamanashi-white.png" alt="Map of japan">

        </div>

        <div id="question-box-1">

            <div class="question-box-1-1">

                <h5 class="small-text-question-1">WHEN</h5>
                <details>

                    <summary style="cursor: pointer;">Empty</summary>

                    <li>Always</li>

                </details>

            </div>

            <div class="question-box-1-2">

                <h5 class="small-text-question-1">CONTINENT</h5>
                <details>

                    <summary style="cursor: pointer;">Empty</summary>

                    <li>Asia</li>

                </details>

            </div>

            <div class="question-box-1-3">

                <h5 class="small-text-question-1">BUDGET</h5>
                <details>

                    <summary style="cursor: pointer;">Empty</summary>

                    <li>Unlimited</li>

                </details>

            </div>

        </div>
        
    </body>
</html>
